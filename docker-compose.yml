services:
  db:
    image: postgres:16-alpine
    container_name: itodo_db
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-itodo}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-itodo}',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: itodo_backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./backend:/app
    command: ['bash', '/app/entrypoint.sh']

  frontend:
    build:
      context: ./frontend
    container_name: itodo_frontend
    depends_on:
      - backend
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=/api
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - PORT=5173
      - WDS_SOCKET_PORT=443
    command: ['npm', 'start']

volumes:
  pg_data:
