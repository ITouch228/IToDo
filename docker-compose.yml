services:
  db:
    image: postgres:16-alpine
    container_name: itodo_db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-itodo}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-itodo}',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: itodo_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8000'
    networks:
      - internal
      - proxy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    container_name: itodo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - '80'
    networks:
      - proxy

volumes:
  pg_data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
