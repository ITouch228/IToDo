name: deploy-dev

on:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (git pull + write .env + compose up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /var/www/itodo-pet-project

            git fetch --all
            git reset --hard origin/main

            umask 077
            mkdir -p backend
            cat > backend/.env << 'EOF'
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=db
            DB_PORT=5432
            DB_NAME=${{ secrets.DB_NAME }}

            PRIVATE_KEY_PATH=/app/keys/private.pem
            PUBLIC_KEY_PATH=/app/keys/public.pem
            EOF

            cat > .env << 'EOF'
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            EOF

            mkdir -p backend/keys
            cat > backend/keys/private.pem << 'EOF'
            ${{ secrets.PRIVATE_KEY_PEM }}
            EOF
            cat > backend/keys/public.pem << 'EOF'
            ${{ secrets.PUBLIC_KEY_PEM }}
            EOF
            chmod 600 backend/keys/private.pem
            chmod 644 backend/keys/public.pem

            docker compose up -d --build --remove-orphans
